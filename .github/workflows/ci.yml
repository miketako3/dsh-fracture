name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: check the bundle manifest ships the patch
        run: node -e "const p=require('./package.json');if(!p.dsh?.bundle?.patch)process.exit(1);console.log('bundle patch:',p.dsh.bundle.patch)"
